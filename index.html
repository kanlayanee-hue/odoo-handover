<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สแกนออเดอร์ส่งไรเดอร์</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(160deg,#f3eefb,#eef1fb);color:#1f2437;font:16px/1.5 "Noto Sans Thai",system-ui,sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:24px;margin:8px 0 2px;text-align:center}
.sub{text-align:center;color:#5b6177;margin:0 0 18px;font-size:14px}
.card{background:#fff;border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 2px 10px rgba(40,50,90,.08)}
label{display:block;font-size:14px;font-weight:600;margin-bottom:6px}
input,textarea{width:100%;padding:12px;border:1px solid #d9dcea;border-radius:10px;font:inherit;background:#f7f8fc}
textarea{min-height:60px}
button{width:100%;padding:13px;border:0;border-radius:10px;font:inherit;font-weight:600;background:#2f4ee0;color:#fff;margin-top:10px;cursor:pointer}
button.g{background:#eef0f8;color:#1f2437}button:disabled{opacity:.5}
:focus-visible{outline:3px solid #8da0ff;outline-offset:2px}
#reader{border-radius:10px;overflow:hidden;margin-top:10px}
.tag{display:inline-block;font-size:13px;padding:1px 10px;border-radius:99px;background:#e3f6ec;color:#17704a;margin-right:6px}
.warn{background:#fff4dc;color:#7a5200;border-radius:8px;padding:8px 10px;margin-top:8px;font-size:14px}
.th{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.th div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.th b{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:99px;background:rgba(0,0,0,.65);color:#fff;text-align:center;line-height:26px;cursor:pointer}
.msg{padding:10px 12px;border-radius:10px;margin-top:10px;font-size:15px}
.ok{background:#e3f6ec;color:#17704a}.er{background:#fde8e8;color:#a32121}
.h{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eceef6;font-size:14px}
.h:last-child{border:0}.mu{color:#7a8097;text-align:center;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>📦 สแกนออเดอร์ส่งไรเดอร์</h1>
<p class="sub">พร้อมบันทึกรูปของลง Odoo อัตโนมัติ</p>

<div class="card" id="setup" hidden>
  <label for="pin">รหัสเข้าแอป</label><input id="pin" type="password" inputmode="numeric" autocomplete="off">
  <p></p><label for="staff">ชื่อพนักงานแพ็ก</label><input id="staff">
  <button id="enter">เข้าใช้งาน</button><div id="setErr"></div>
</div>

<div id="app" hidden>
  <div class="card">
    <label for="code">เลขออเดอร์ล่าสุด</label>
    <input id="code" placeholder="ไม่ต้องคลิก เสียบเครื่องสแกนแล้วยิงได้เลย" autocomplete="off">
    <button id="cam">▶️ เปิดกล้อง</button>
    <div id="reader"></div>
    <div id="findOut"></div>
    <div id="qstat"></div>
    <div id="todo" class="mu"></div>
  </div>

  <div class="card" id="shoot" hidden>
    <span class="tag" id="oBy"></span><b id="oName"></b><br><small id="oCust" style="color:#5b6177"></small>
    <div class="warn" id="oWarn" hidden>ออเดอร์นี้ไม่ใช่ Grab / รับเอง / จัดส่งเอง / รับสินค้าเอง ตรวจสอบก่อนบันทึก</div>
    <p></p><label>ถ่ายรูปของที่ส่งให้ไรเดอร์ (สูงสุด 8 รูป)</label>
    <input id="pic" type="file" accept="image/*" capture="environment" multiple>
    <div class="th" id="th"></div>
    <p></p><label for="note">หมายเหตุ (ไม่บังคับ)</label><textarea id="note"></textarea>
    <button id="save" disabled>บันทึกลง Odoo</button>
    <button class="g" id="cancel">ยกเลิก</button>
    <div id="saveOut"></div>
  </div>

  <div class="card">
    <label>🕘 ประวัติการบันทึกล่าสุด</label>
    <div id="hist"></div>
  </div>
</div>
</main>

<script>
// ใส่ลิงก์ Web app ที่ได้จาก Apps Script ตรงนี้
const API_URL='https://script.google.com/macros/s/AKfycbxkDf8IGXHMTyEXWFSDV8V1G7x2E7TYUFudLhm9ht9Oh5mkusSdO_iViD56s3nikM1r/exec';

const $=id=>document.getElementById(id);
let pin=localStorage.getItem('pin')||'', staff=localStorage.getItem('staff')||'', cur=null, pics=[], sc=null, busy=false, lastCode='', lastAt=0;

async function api(body){
  const r=await fetch(API_URL,{method:'POST',body:JSON.stringify({...body,pin})});
  const j=await r.json(); if(j.error) throw new Error(j.error); return j;
}
setInterval(()=>{ if(!document.hidden&&sc&&sc.isScanning) api({action:'ping'}).catch(()=>{}) },240000);
function msg(el,cls,t){ el.innerHTML='<div class="msg '+cls+'"></div>'; el.firstChild.textContent=t }

function start(){ $('setup').hidden=true; $('app').hidden=false; hist(); $('code').focus() }
if(pin&&staff) start(); else $('setup').hidden=false;
$('enter').onclick=async()=>{
  pin=$('pin').value.trim(); staff=$('staff').value.trim();
  if(!pin||!staff) return msg($('setErr'),'er','กรอกรหัสและชื่อพนักงาน');
  try{ await api({action:'ping'}); localStorage.setItem('pin',pin); localStorage.setItem('staff',staff); start() }
  catch(e){ msg($('setErr'),'er',e.message) }
};

$('code').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); find($('code').value) } });

$('cam').onclick=async()=>{
  unlockAudio(); api({action:'ping'}).catch(()=>{});
  if(sc&&sc.isScanning){ await sc.stop(); $('cam').textContent='▶️ เปิดกล้อง'; return }
  try{
    sc=sc||new Html5Qrcode('reader',{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39],experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});
    await sc.start({facingMode:'environment'},{fps:25,disableFlip:true,qrbox:(w,h)=>({width:Math.floor(w*.92),height:Math.floor(h*.8)}),videoConstraints:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}},t=>{ const c=norm(t); if(c===lastCode&&Date.now()-lastAt<6000) return; find(t,snap()) },()=>{});
    $('cam').textContent='⏹ ปิดกล้อง';
  }catch(e){ msg($('findOut'),'er','เปิดกล้องไม่ได้ อนุญาตการใช้กล้องในเบราว์เซอร์') }
};

// ถอดเลขออเดอร์ออกจากข้อความใน QR (กรณีเป็น URL หรือข้อความยาว)
// เสียงบี๊บ (Web Audio) ไม่ต้องใช้ไฟล์เสียง
let actx=null;
function unlockAudio(){ try{ actx=actx||new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume() }catch(e){} }
document.addEventListener('pointerdown',unlockAudio);
function tone(f,ms,delay){ try{ if(!actx) return; const t0=actx.currentTime+(delay||0)/1000, o=actx.createOscillator(), g=actx.createGain();
  o.type='square'; o.frequency.value=f; g.gain.setValueAtTime(.9,t0); g.gain.setValueAtTime(.9,t0+ms/1000*.75); g.gain.exponentialRampToValueAtTime(.001,t0+ms/1000);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0+ms/1000) }catch(e){} }
const beepScan=()=>tone(2200,130);                          // อ่านเจอ
const beepOK=()=>{ tone(1200,130); tone(1800,220,160) };      // บันทึกสำเร็จ
const beepErr=()=>tone(400,550);                            // ผิดพลาด

function norm(t){
  t=(t||'').trim(); if(!t) return '';
  if(/^[A-Za-z0-9._\/\-]{3,40}$/.test(t)) return t;
  const m=t.match(/\b\d{6}[A-Z0-9]{6,10}\b/)||t.match(/\bJTTH\d{8,}\b/);
  return m?m[0]:t;
}
// ถ่ายภาพจากเฟรมกล้องในจังหวะที่สแกนได้
function snap(){
  const v=document.querySelector('#reader video'); if(!v||!v.videoWidth) return null;
  const s=Math.min(1,1400/Math.max(v.videoWidth,v.videoHeight)), c=document.createElement('canvas');
  c.width=v.videoWidth*s; c.height=v.videoHeight*s; c.getContext('2d').drawImage(v,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',.72);
}
function addHist(n,c){
  const h=JSON.parse(localStorage.getItem('hist')||'[]');
  h.unshift({n:n,c:c,t:new Date().toLocaleString('th-TH',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})});
  localStorage.setItem('hist',JSON.stringify(h.slice(0,10))); hist();
}
// งานส่งด่วน: ใช้ภาพจากกล้องบันทึกลงชีตทันที กล้องยังเปิดอยู่เพื่อสแกนใบต่อไป
async function quickSave(c,frame){
  msg($('findOut'),'ok','กำลังบันทึก '+c.code+' …');
  try{
    const r=await api({action:'save',code:c.code,route:'sheet',staff,note:'',photos:[frame.split(',')[1]]});
    addHist(r.name,r.photos); lastCode=c.code; lastAt=Date.now();
    if(navigator.vibrate) navigator.vibrate(60);
    msg($('findOut'),'ok','บันทึกแล้ว '+c.code+(c.found?' (ส่งด่วน → ชีต)':' (ไม่พบใน Odoo → ชีต)')); beepOK();
  }catch(e){ msg($('findOut'),'er',e.message); beepErr() }
}

// คิวส่งเข้าชีตเบื้องหลัง: แจ้งว่ารับแล้วทันที แล้วส่งต่อโดยไม่บล็อกการสแกนใบถัดไป
const queue=[], failed=[]; let sending=0, qDone=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function enqueue(job){ queue.push(job); pump(); updateStatus() }
function pump(){
  while(sending<2 && queue.length){
    const job=queue.shift(); sending++;
    (async()=>{
      try{ await api({action:'save',code:job.code,route:'sheet',staff,note:'',photos:[job.photo]}); addHist(job.code,1) }
      catch(e){
        job.tries=(job.tries||0)+1;
        if(job.tries<3){ await sleep(1500*job.tries); queue.push(job) } else { failed.push(job); beepErr() }
      }
      sending--; updateStatus(); pump();
    })();
  }
}
function updateStatus(){
  const el=$('qstat'), pending=queue.length+sending; el.innerHTML='';
  if(failed.length){
    const d=document.createElement('div'); d.className='msg er';
    d.textContent='ส่งเข้าชีตไม่สำเร็จ '+failed.length+' รายการ ('+failed.map(j=>j.code).join(', ')+') ';
    const b=document.createElement('button'); b.className='g'; b.textContent='ลองส่งใหม่';
    b.onclick=()=>{ while(failed.length) queue.push(failed.shift()); pump(); updateStatus() };
    d.appendChild(b); el.appendChild(d); return;
  }
  if(pending){ el.innerHTML='<p class="mu">กำลังส่งเข้าชีต '+pending+' รายการ…</p>'; qDone=true }
  else if(qDone){ qDone=false; msg(el,'ok','ส่งเข้าชีตครบแล้ว ✓');
    setTimeout(()=>{ if(!queue.length&&!sending&&!failed.length) el.innerHTML='' },3000) }
}
window.addEventListener('beforeunload',e=>{ if(queue.length||sending||failed.length){ e.preventDefault(); e.returnValue='' } });

let inflight=0; const todo=[];
function cardOpen(){ return !$('shoot').hidden }
function renderTodo(){
  $('todo').textContent=todo.length?('รอถ่ายรูปส่ง Odoo อีก '+todo.length+' ใบ: '+todo.map(x=>x.code).join(', ')):'';
}
function openCard(r){
  cur=r; pics=[]; draw(); $('findOut').innerHTML=''; $('saveOut').innerHTML=''; $('note').value='';
  if(sc&&sc.isScanning){ sc.stop().then(()=>{ $('cam').textContent='▶️ เปิดกล้อง' }).catch(()=>{}) }
  const odoo=r.route==='odoo';
  $('oBy').textContent=odoo?(r.sheetDone?'ส่งเข้า Odoo (ชีตบันทึกแล้ว)':'Odoo + ชีต'):'ชีตอย่างเดียว';
  $('oName').textContent=r.found?r.name+(r.model==='stock.picking'?' (ใบส่งของ)':''):r.code;
  $('oCust').textContent=(r.partner||'')+((r.delivery_by||[]).length?' · '+r.delivery_by.join(', '):'');
  $('oWarn').textContent=r.found?'งานส่งด่วน (ไม่ใช่ Grab / รับเอง / จัดส่งเอง / รับสินค้าเอง) จะบันทึกลงชีตอย่างเดียว':'ไม่พบเลขนี้ใน Odoo จะบันทึกลงชีตอย่างเดียว ตรวจเลขให้ถูกก่อนบันทึก';
  $('oWarn').hidden=odoo; $('shoot').hidden=false; renderTodo();
}
function offer(r){ if(cardOpen()){ todo.push(r); renderTodo() } else openCard(r) }

async function find(text,frame){
  text=norm(text); if(!text) return;
  if(frame){
    // สแกนด้วยกล้อง: เสียง + แถบเขียว + เก็บลงชีตทันที แล้วค่อยตรวจใน Odoo ว่าต้องถ่ายรูปส่ง Odoo หรือไม่
    if(text===lastCode && Date.now()-lastAt<6000) return;
    lastCode=text; lastAt=Date.now();
    beepScan(); if(navigator.vibrate) navigator.vibrate(60);
    enqueue({code:text,photo:frame.split(',')[1]});
    msg($('findOut'),'ok','รับแล้ว '+text+' …');
    try{
      const r=await api({action:'lookup',code:text}); r.sheetDone=true;
      if(r.route==='odoo'){ beepOK(); offer(r) }
      else msg($('findOut'),'ok','รับแล้ว '+text+(r.found?' (ส่งด่วน → ชีต)':' (ไม่พบใน Odoo → ชีต)'));
    }catch(e){ beepErr(); msg($('findOut'),'er','เก็บลงชีตแล้ว แต่ตรวจ Odoo ไม่สำเร็จ ถ้าเป็นงาน Grab/รับเอง/จัดส่งเอง/รับสินค้าเอง ให้สแกนใหม่: '+e.message) }
    return;
  }
  // พิมพ์เลข / เครื่องยิงบาร์โค้ด (ไม่มีภาพจากกล้อง): ตรวจก่อน แล้วเปิดการ์ดให้เลือกรูป
  if(busy) return; busy=true; beepScan();
  $('findOut').innerHTML='<p class="mu">กำลังค้นหา…</p>';
  try{
    const r=await api({action:'lookup',code:text}); r.sheetDone=false;
    if(navigator.vibrate) navigator.vibrate(60);
    openCard(r);
  }catch(e){ msg($('findOut'),'er',e.message); beepErr(); $('code').select() }
  busy=false;
}

function shrink(f){return new Promise(res=>{
  const im=new Image(); im.onload=()=>{
    const s=Math.min(1,1400/Math.max(im.width,im.height)), c=document.createElement('canvas');
    c.width=im.width*s; c.height=im.height*s; c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',.75)); URL.revokeObjectURL(im.src);
  }; im.src=URL.createObjectURL(f);
})}
$('pic').onchange=async e=>{ for(const f of e.target.files){ if(pics.length<8) pics.push(await shrink(f)) } e.target.value=''; draw() };
function draw(){
  $('th').innerHTML='';
  pics.forEach((p,i)=>{ const d=document.createElement('div'),im=document.createElement('img'),x=document.createElement('b');
    im.src=p; x.textContent='×'; x.onclick=()=>{pics.splice(i,1);draw()}; d.append(im,x); $('th').append(d) });
  $('save').disabled=!pics.length;
}
function reset(){ cur=null; pics=[]; $('shoot').hidden=true; $('code').value=''; if(todo.length){ openCard(todo.shift()) } else { $('code').focus() } }
$('cancel').onclick=reset;

$('save').onclick=async()=>{
  if(!cur.found && !confirm('ไม่พบเลขนี้ใน Odoo บันทึกเป็นงานส่งด่วน (ชีตอย่างเดียว) ใช่ไหม')) return;
  $('save').disabled=true; $('save').textContent='กำลังบันทึก…';
  try{
    const r=await api({action:'save',code:cur.code,route:(cur.sheetDone&&cur.route==='odoo'?'odoo_only':cur.route),model:cur.model,id:cur.id,staff,note:$('note').value,photos:pics.map(p=>p.split(',')[1])});
    if(cur.route==='odoo'&&!r.odoo) throw new Error('Apps Script ยังเป็นเวอร์ชันเก่า กรุณา Deploy ใหม่ก่อน');
    const h=JSON.parse(localStorage.getItem('hist')||'[]');
    h.unshift({n:r.name,c:r.photos,t:new Date().toLocaleString('th-TH',{hour:'2-digit',minute:'2-digit',day:'numeric',month:'short'})});
    localStorage.setItem('hist',JSON.stringify(h.slice(0,10))); hist();
    msg($('saveOut'),'ok','บันทึกแล้ว '+r.photos+' รูป ที่ '+r.name+(r.odoo?' (ส่งเข้า Odoo และชีต)':' (ชีต)')); beepOK(); setTimeout(reset,1800);
  }catch(e){ msg($('saveOut'),'er',e.message); beepErr() }
  $('save').textContent='บันทึกลง Odoo'; draw();
};
function hist(){
  const h=JSON.parse(localStorage.getItem('hist')||'[]'); $('hist').innerHTML='';
  if(!h.length) return $('hist').innerHTML='<p class="mu">ยังไม่มีข้อมูล</p>';
  h.forEach(x=>{ const d=document.createElement('div'); d.className='h'; d.innerHTML='<span></span><span></span>';
    d.children[0].textContent=x.n+' · '+x.c+' รูป'; d.children[1].textContent=x.t; $('hist').append(d) });
}
</script>
</body>
</html>
